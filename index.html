const doc=new D.Document({creator:'Word Web',title:fname(),numbering:{config:num},styles:{default:{document:{run:{font:ed.style.fontFamily?ed.style.fontFamily.replace(/["']/g,''):'Calibri',size:22}}}},
sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:m,bottom:m,left:m,right:m}}},
headers:{default:new D.Header({children:[new D.Paragraph({children:[new D.TextRun({text:txt($('#hdr')),color:'777777',size:20})]})]})},
footers:{default:new D.Footer({children:[new D.Paragraph({alignment:'center',children:[new D.TextRun({text:txt($('#ftr'))?txt($('#ftr'))+'   ':'',color:'777777',size:20}),new D.TextRun({children:[D.PageNumber.CURRENT],size:20})]})]})},children:body}]});
const blob=await D.Packer.toBlob(doc);if(!blob||blob.size<500)throw new Error('El archivo generado está vacío.');dl(blob,fname()+'.docx');toast('Word (.docx) generado: '+Math.round(blob.size/1024)+' KB')}catch(e){console.error(e);toast('Error al exportar a Word: '+e.message)}}
// atajos
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.altKey&&k=='q'){e.preventDefault();qi.focus();return}if(!(e.ctrlKey||e.metaKey))return;
if(k=='f'){e.preventDefault();fd.showModal()}else if(k=='y'){e.preventDefault();ex('redo')}else if(k=='s'){e.preventDefault();saveHtml()}
else if(k=='b'||k=='i'||k=='u'){if(document.activeElement==ed)return}});
// carga inicial
// ===== Imágenes movibles / redimensionables =====
function selImg(t){if(im)im.classList.remove('sel');im=t;if(t)t.classList.add('sel')}
ed.addEventListener('dragstart',e=>{if(e.target.tagName=='IMG')e.preventDefault()});
ed.addEventListener('pointerdown',e=>{const t=e.target;if(t.tagName!='IMG'){selImg(null);return}selImg(t);ed.focus();const r=t.getBoundingClientRect();drag={r:e.clientX>r.right-16&&e.clientY>r.bottom-16,x:e.clientX,y:e.clientY,w:t.width,l:parseFloat(t.style.left)||0,t:parseFloat(t.style.top)||0,z:+$('#zr').value/100};t.setPointerCapture(e.pointerId);e.preventDefault()});
ed.addEventListener('pointermove',e=>{if(!drag){const t=e.target,r=t.tagName=='IMG'&&t.getBoundingClientRect();ed.style.cursor=r?(e.clientX>r.right-16&&e.clientY>r.bottom-16?'nwse-resize':'move'):'';return}
const dx=(e.clientX-drag.x)/drag.z,dy=(e.clientY-drag.y)/drag.z;if(drag.r){im.removeAttribute('width');im.style.width=Math.max(30,drag.w+dx)+'px';im.style.height='auto'}else{im.style.position='relative';im.style.left=(drag.l+dx)+'px';im.style.top=(drag.t+dy)+'px'}});
const endDrag=()=>{if(drag){drag=null;change()}};ed.addEventListener('pointerup',endDrag);ed.addEventListener('pointercancel',endDrag);
ed.addEventListener('keydown',e=>{if(im&&ed.contains(im)&&e.key=='Delete'){e.preventDefault();im.remove();im=null;change()}});
// ===== Gestor de documentos (localStorage): pantalla de inicio =====
const IDX=()=>{try{return JSON.parse(localStorage.getItem('ww.idx'))||[]}catch(e){return[]}},saveIdx=a=>localStorage.setItem('ww.idx',JSON.stringify(a)),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=h=>h.replace(/\s*class="sel"/g,'');
function persist(){if(!curId)return;try{const a=IDX();let d=a.find(x=>x.id==curId);if(!d){d={id:curId};a.push(d)}
d.n=$('#name').value||'Documento';d.t=Date.now();d.w=words();d.p=ed.innerText.slice(0,400);
localStorage.setItem('ww.d.'+curId,JSON.stringify({h:clean(ed.innerHTML),hd:$('#hdr').innerHTML,ft:$('#ftr').innerHTML,m:margin}));saveIdx(a);dirty=false;$('#state').textContent=T('Guardado')}catch(e){$('#state').textContent=T('Error al guardar');toast('No se pudo guardar localmente (¿documento o imágenes demasiado grandes?). Descarga el HTML o el DOCX.')}}
function loadDoc(id){let d;try{d=JSON.parse(localStorage.getItem('ww.d.'+id))}catch(e){}if(!d)return toast('No se pudo abrir el documento.');const m=IDX().find(x=>x.id==id);curId=id;selImg(null);
ed.innerHTML=d.h||'<p><br></p>';$('#hdr').innerHTML=d.hd||'';$('#ftr').innerHTML=d.ft||'';$('#name').value=m?m.n:'Documento';setM(d.m||94,1);$('#sheet').style.backgroundColor='';
dirty=false;$('#state').textContent=T('Guardado');document.body.classList.remove('hv');$('#home').style.display='none';buildNav();stats();ed.focus()}
function createDoc(){curId='d'+Date.now().toString(36);ed.innerHTML='<p><br></p>';$('#hdr').innerHTML='';$('#ftr').innerHTML='';$('#name').value=T('Documento')+' '+(IDX().length+1);setM(94,1);dirty=true;persist();loadDoc(curId)}
function showHome(){clearTimeout(tmr);if(curId&&dirty)persist();curId=null;document.body.classList.add('hv');$('#home').style.display='block';renderHome()}
function renderHome(){const q=($('#hq').value||'').toLowerCase(),a=IDX().filter(d=>d.n.toLowerCase().includes(q)).sort((x,y)=>y.t-x.t);
$('#grid').innerHTML='<div class="card new" data-act="new"><svg class="i" viewBox="0 0 24 24" style="width:40px;height:40px;color:var(--blue)"><path d="M12 5v14M5 12h14"/></svg><b>Nuevo documento</b></div>'+a.map(d=>`<div class="card" data-id="${d.id}"><div class="pv nt">${esc(d.p||'')}</div><div class="ci nt"><b>${esc(d.n)}</b><small>${esc(new Date(d.t).toLocaleDateString(LOC[lang]))} · ${esc(T((d.w||0)+' palabras'))}</small></div><div class="ca"><button data-act="ren" title="Renombrar">${ic.edit}</button><button data-act="dup" title="Duplicar">${ic.dup}</button><button data-act="del" title="Eliminar">${ic.trash}</button></div></div>`).join('');trDom($('#home'))}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const b=e.target.closest('[data-act]'),act=b?b.dataset.act:(c.dataset.id?'open':'new'),id=c.dataset.id,a=IDX(),d=a.find(x=>x.id==id);
if(act=='open')loadDoc(id);else if(act=='new')createDoc();
else if(act=='ren'){const n=prompt('Nuevo nombre',d.n);if(n&&n.trim()){d.n=n.trim();saveIdx(a);renderHome()}}
else if(act=='dup'){const nid='d'+Date.now().toString(36);try{localStorage.setItem('ww.d.'+nid,localStorage.getItem('ww.d.'+id));a.push({...d,id:nid,n:d.n+' (2)',t:Date.now()});saveIdx(a)}catch(x){toast('Error al guardar')}renderHome()}
else if(act=='del'&&confirm('¿Eliminar este documento? No se puede deshacer.')){localStorage.removeItem('ww.d.'+id);saveIdx(a.filter(x=>x.id!=id));renderHome()}});
// carga inicial (migra el documento único de versiones anteriores)
try{if(!localStorage.getItem('ww.idx')){const o=JSON.parse(localStorage.getItem('wordweb.doc'));if(o){const id='d'+Date.now().toString(36);localStorage.setItem('ww.d.'+id,JSON.stringify({h:o.h,hd:o.hd,ft:o.ft,m:o.m}));saveIdx([{id,n:o.n||'Documento',t:Date.now(),w:0,p:''}])}}}catch(e){}
showHome();
dirty=false;$('#state').textContent=T('Guardado');stats();buildNav();
if(lang!='es')setLang(lang);else $('#lang').value='es';
